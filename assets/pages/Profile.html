<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/Global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<title>Perfil</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.profile-card{max-width:500px;margin:60px auto;padding:30px;background:#fff;border-radius:15px;text-align:center;box-shadow:0 0 10px rgba(0,0,0,.15)}
.profile-card i{font-size:90px;margin-bottom:15px}
.profile-card h2{margin-bottom:10px}
.profile-card p{margin:8px 0}
.btn-home,.btn-logout{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;margin:10px}
</style>
</head>
<body>
<nav class="nav-bar">
<div class="logo">JPL</div>
<ul class="nav-list">
<li class="nav-links"><a class="nav-link" href="../../Index.html">Home</a></li>
</ul>
</nav>
<div class="profile-card">
<i class="fa-solid fa-user-circle"></i>
<h2 id="nomePerfil">Usuário</h2>
<p id="emailPerfil">Email não disponível</p>
<p>Cliente da JPL Store</p>
<button class="btn-home" onclick="window.location='../../Index.html'">Voltar à Loja</button>
<button class="btn-logout" id="logoutBtn">Sair</button>
</div>
<script>
const user=JSON.parse(localStorage.getItem('usuarioLogado'));
if(user){
document.getElementById('nomePerfil').textContent=user.usuario||'Usuário';
document.getElementById('emailPerfil').textContent=user.email||'Sem email';
}
document.getElementById('logoutBtn').addEventListener('click',()=>{
localStorage.removeItem('usuarioLogado');
window.location='login.html';
});
</script>
</body></html>
